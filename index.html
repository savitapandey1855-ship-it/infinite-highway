<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Infinite Highway — Car Driving Game</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { overflow:hidden; background:#000; font-family:'Segoe UI',system-ui,sans-serif; touch-action:none; user-select:none; }
  canvas { display:block; }

  /* ── Loading ── */
  #loading {
    position:fixed; inset:0; background:#0a0a12; color:#e0e0e0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:100; transition:opacity .6s;
  }
  #loading h1 { font-size:1.6rem; margin-bottom:12px; letter-spacing:2px; color:#4fc3f7; }
  #loading p { color:#888; font-size:.85rem; }
  #loading-bar { width:240px; height:4px; background:#222; border-radius:2px; margin-top:20px; overflow:hidden; }
  #loading-fill { height:100%; width:0%; background:linear-gradient(90deg,#4fc3f7,#81d4fa); transition:width .3s; }

  /* ── HUD ── */
  #hud {
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:20px; align-items:flex-end; z-index:10; pointer-events:none;
  }
  .hud-box {
    background:rgba(10,15,25,.75); border:1px solid rgba(79,195,247,.3);
    border-radius:10px; padding:8px 16px; backdrop-filter:blur(8px);
    color:#e0e0e0; text-align:center; min-width:90px;
  }
  .hud-label { font-size:.6rem; text-transform:uppercase; letter-spacing:1px; color:#4fc3f7; margin-bottom:3px; }
  .hud-value { font-size:1.4rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .hud-unit { font-size:.65rem; color:#888; }

  #speedo-ring { width:100px; height:100px; position:relative; }
  #speedo-ring svg { transform:rotate(-90deg); }
  #speedo-center {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  #speedo-center .val { font-size:1.7rem; font-weight:800; color:#fff; font-variant-numeric:tabular-nums; }
  #speedo-center .unit { font-size:.55rem; color:#4fc3f7; text-transform:uppercase; letter-spacing:1px; }

  /* ── Top bar ── */
  #top-bar {
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    z-index:10; background:rgba(10,15,25,.75);
    border:1px solid rgba(79,195,247,.2); border-radius:8px;
    padding:6px 18px; backdrop-filter:blur(8px); color:#e0e0e0;
    font-size:.78rem; letter-spacing:.5px; white-space:nowrap;
  }
  #top-bar span { color:#4fc3f7; font-weight:600; }

  /* ── Gear indicator ── */
  #gear-ind {
    position:fixed; bottom:16px; right:16px; z-index:10;
    background:rgba(10,15,25,.75); border:1px solid rgba(79,195,247,.3);
    border-radius:8px; padding:6px 14px; color:#4fc3f7; font-size:1.1rem;
    font-weight:700; backdrop-filter:blur(8px); min-width:36px; text-align:center;
  }

  /* ── Desktop controls hint ── */
  #controls-hint {
    position:fixed; top:12px; right:12px; z-index:10;
    background:rgba(10,15,25,.75); border:1px solid rgba(79,195,247,.2);
    border-radius:8px; padding:10px 14px; color:#ccc; font-size:.7rem;
    backdrop-filter:blur(8px); line-height:1.7;
  }
  #controls-hint kbd {
    background:rgba(79,195,247,.15); border:1px solid rgba(79,195,247,.3);
    border-radius:3px; padding:1px 5px; font-size:.68rem; color:#4fc3f7; font-family:monospace;
  }

  /* ── Mobile touch controls ── */
  #mobile-controls { display:none; position:fixed; inset:0; z-index:20; pointer-events:none; }
  .touch-btn {
    position:absolute; pointer-events:auto;
    background:rgba(79,195,247,.12); border:2px solid rgba(79,195,247,.35);
    border-radius:50%; color:#4fc3f7; font-size:1.8rem;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(6px); transition:background .1s, transform .08s;
    -webkit-user-select:none; user-select:none;
  }
  .touch-btn:active, .touch-btn.pressed {
    background:rgba(79,195,247,.35); transform:scale(.92);
  }
  #btn-left  { left:20px; bottom:130px; width:70px; height:70px; }
  #btn-right { left:105px; bottom:130px; width:70px; height:70px; }
  #btn-gas   { right:20px; bottom:130px; width:80px; height:80px; font-size:1.5rem; }
  #btn-brake { right:110px; bottom:145px; width:65px; height:65px; font-size:1.3rem; }

  /* Camera button */
  #btn-camera {
    position:fixed; top:12px; left:12px; z-index:10;
    width:42px; height:42px; pointer-events:auto;
    background:rgba(10,15,25,.75); border:1px solid rgba(79,195,247,.3);
    border-radius:8px; color:#4fc3f7; font-size:1.1rem;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(8px);
  }

  /* ── Mobile responsive ── */
  @media (max-width:768px) and (pointer:coarse) {
    #mobile-controls { display:block; }
    #controls-hint { display:none; }
    #hud { gap:12px; bottom:10px; }
    .hud-box { min-width:70px; padding:6px 10px; }
    .hud-value { font-size:1.1rem; }
    #speedo-ring { width:80px; height:80px; }
    #speedo-center .val { font-size:1.3rem; }
    #top-bar { font-size:.68rem; padding:4px 12px; }
    #gear-ind { bottom:10px; right:10px; font-size:.9rem; padding:4px 10px; }
    #btn-left  { bottom:100px; width:60px; height:60px; font-size:1.4rem; }
    #btn-right { left:90px; bottom:100px; width:60px; height:60px; font-size:1.4rem; }
    #btn-gas   { right:15px; bottom:100px; width:70px; height:70px; font-size:1.2rem; }
    #btn-brake { right:95px; bottom:110px; width:55px; height:55px; font-size:1rem; }
  }

  @media (max-width:480px) {
    #hud { gap:8px; }
    .hud-box { min-width:56px; padding:4px 8px; }
    .hud-value { font-size:.95rem; }
    #speedo-ring { width:68px; height:68px; }
    #speedo-center .val { font-size:1.1rem; }
    #speedo-center .unit { font-size:.45rem; }
    .hud-label { font-size:.5rem; }
  }
</style>
</head>
<body>

<div id="loading">
  <h1>INFINITE HIGHWAY</h1>
  <p id="loading-msg">Loading car model...</p>
  <div id="loading-bar"><div id="loading-fill"></div></div>
</div>

<div id="top-bar">DISTANCE: <span id="dist-val">0.0</span> km</div>

<div id="hud">
  <div class="hud-box">
    <div class="hud-label">Score</div>
    <div class="hud-value" id="score-val">0</div>
  </div>
  <div id="speedo-ring">
    <svg width="100" height="100">
      <circle cx="50" cy="50" r="43" stroke="rgba(255,255,255,0.08)" stroke-width="5" fill="none"/>
      <circle id="speedo-arc" cx="50" cy="50" r="43" stroke="#4fc3f7" stroke-width="5" fill="none"
              stroke-dasharray="270.2" stroke-dashoffset="270.2" stroke-linecap="round"/>
    </svg>
    <div id="speedo-center">
      <div class="val" id="speed-val">0</div>
      <div class="unit">km/h</div>
    </div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Top Speed</div>
    <div class="hud-value" id="topspeed-val">0</div>
    <div class="hud-unit">km/h</div>
  </div>
</div>

<div id="controls-hint">
  <kbd>W</kbd>/<kbd>↑</kbd> Accelerate<br>
  <kbd>S</kbd>/<kbd>↓</kbd> Brake<br>
  <kbd>A</kbd>/<kbd>←</kbd> Left<br>
  <kbd>D</kbd>/<kbd>→</kbd> Right<br>
  <kbd>Space</kbd> Handbrake<br>
  <kbd>C</kbd> Camera
</div>

<button id="btn-camera">📷</button>
<div id="gear-ind">D</div>

<!-- Mobile touch controls -->
<div id="mobile-controls">
  <div class="touch-btn" id="btn-left">◀</div>
  <div class="touch-btn" id="btn-right">▶</div>
  <div class="touch-btn" id="btn-gas">GAS</div>
  <div class="touch-btn" id="btn-brake">BRK</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ═══════════════════════════════════════════════════
//  Z-UP COORDINATE SYSTEM
//  X = left/right, Y = forward/backward, Z = up
// ═══════════════════════════════════════════════════

// ─── Renderer ────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ─── Scene ───────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a6c4);
scene.fog = new THREE.Fog(0x87a6c4, 800, 3000);

// ─── Camera (Z-up) ───────────────────────────────
const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.5, 5000);
camera.up.set(0, 0, 1);
camera.position.set(0, -80, 50);

// ─── Lighting ─────────────────────────────────────
const hemi = new THREE.HemisphereLight(0xbfd8e8, 0x4a5a2a, 0.6);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff4e0, 1.5);
sun.position.set(300, 200, 600);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 50;
sun.shadow.camera.far = 1500;
sun.shadow.camera.left = -300;
sun.shadow.camera.right = 300;
sun.shadow.camera.top = 300;
sun.shadow.camera.bottom = -300;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(sun.target);

// ═══════════════════════════════════════════════════
//  PROCEDURAL CITY
// ═══════════════════════════════════════════════════
const ROAD_HALF_WIDTH = 60;
const SIDEWALK_WIDTH = 12;
const BUILDING_OFFSET = ROAD_HALF_WIDTH + SIDEWALK_WIDTH + 5;
const TILE_LENGTH = 400;
const NUM_TILES = 8;

// ─── Material cache ──────────────────────────────
const matAsphalt = new THREE.MeshStandardMaterial({ color:0x2a2a2e, roughness:0.9, metalness:0.0 });
const matLaneWhite = new THREE.MeshStandardMaterial({ color:0xf0f0f0, roughness:0.6, emissive:0x222222 });
const matSidewalk = new THREE.MeshStandardMaterial({ color:0x9e9e9e, roughness:0.8 });
const matCurb = new THREE.MeshStandardMaterial({ color:0xcccccc, roughness:0.7 });
const matStreetLight = new THREE.MeshStandardMaterial({ color:0x555555, roughness:0.5, metalness:0.7 });
const matLamp = new THREE.MeshStandardMaterial({ color:0xfff4e0, emissive:0xfff4e0, emissiveIntensity:0.8 });
const matGrass = new THREE.MeshStandardMaterial({ color:0x3a5f2a, roughness:0.9 });
const matTreeTrunk = new THREE.MeshStandardMaterial({ color:0x4a3520, roughness:0.8 });
const matTreeLeaves = new THREE.MeshStandardMaterial({ color:0x2d6a2d, roughness:0.8 });

const buildingColors = [
  0x8d9196, 0xa0a5ab, 0x7a8088, 0xb5b8bc, 0x948e96,
  0xc4b9a8, 0xb8a990, 0xd1c4b0, 0xa89882, 0xc0a882,
  0x6d7378, 0x808890, 0x98a0a8, 0x5a6068, 0x707880,
];
const buildingRoofColors = [0x3a3a3a, 0x4a3530, 0x2a2a2a, 0x3a3530];

// ─── Reusable geometries ─────────────────────────
const geoRoadTile = new THREE.PlaneGeometry(ROAD_HALF_WIDTH * 2, TILE_LENGTH);
const geoSidewalkL = new THREE.BoxGeometry(SIDEWALK_WIDTH, TILE_LENGTH, 2);
const geoCurb = new THREE.BoxGeometry(1.5, TILE_LENGTH, 1);
const geoLaneDash = new THREE.PlaneGeometry(1.5, 8);
const geoLaneSolid = new THREE.PlaneGeometry(1.5, TILE_LENGTH);
const geoLampPole = new THREE.CylinderGeometry(0.5, 0.6, 40, 8);
const geoLampHead = new THREE.SphereGeometry(2.5, 12, 8);
const geoLampArm = new THREE.BoxGeometry(8, 1, 1);
const geoTreeTrunk = new THREE.CylinderGeometry(1, 1.5, 15, 6);
const geoTreeCone = new THREE.ConeGeometry(6, 18, 8);
const geoWindow = new THREE.PlaneGeometry(2, 2);

// ─── Tile builder ────────────────────────────────
const cityTiles = [];

function createBuilding(x, y, z, width, depth, height) {
  const group = new THREE.Group();
  const bColor = buildingColors[Math.floor(Math.random() * buildingColors.length)];

  const wallMat = new THREE.MeshStandardMaterial({ color:bColor, roughness:0.85, metalness:0.05 });
  const roofMat = new THREE.MeshStandardMaterial({
    color: buildingRoofColors[Math.floor(Math.random()*buildingRoofColors.length)],
    roughness:0.9
  });

  const body = new THREE.Mesh(new THREE.BoxGeometry(width, depth, height), wallMat);
  body.position.set(0, 0, height/2);
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const roof = new THREE.Mesh(new THREE.BoxGeometry(width+1, depth+1, 1.5), roofMat);
  roof.position.set(0, 0, height + 0.75);
  roof.castShadow = true;
  group.add(roof);

  // Windows on the side facing the road
  const roadSide = x < 0 ? 1 : -1;
  const winMat = new THREE.MeshStandardMaterial({
    color: 0x223344, roughness:0.3, metalness:0.5,
    emissive: Math.random() > 0.6 ? 0x4fc3f7 : 0x000000,
    emissiveIntensity: 0.3
  });
  const floors = Math.floor(height / 8);
  const winPerFloor = Math.floor(depth / 6);
  for (let f = 0; f < floors; f++) {
    for (let w = 0; w < winPerFloor; w++) {
      const win = new THREE.Mesh(geoWindow, winMat);
      win.position.set(roadSide * (width/2 + 0.1), -depth/2 + 4 + w * 6, 6 + f * 8);
      win.rotation.y = roadSide > 0 ? Math.PI/2 : -Math.PI/2;
      group.add(win);
    }
  }

  group.position.set(x, y, z);
  return group;
}

function createStreetLight(x, y) {
  const group = new THREE.Group();
  const pole = new THREE.Mesh(geoLampPole, matStreetLight);
  pole.rotation.x = -Math.PI / 2; // Rotate cylinder from Y to Z (up)
  pole.position.set(0, 0, 20);
  pole.castShadow = true;
  group.add(pole);

  const arm = new THREE.Mesh(geoLampArm, matStreetLight);
  arm.position.set(x > 0 ? -4 : 4, 0, 38);
  group.add(arm);

  const head = new THREE.Mesh(geoLampHead, matLamp);
  head.position.set(x > 0 ? -8 : 8, 0, 38);
  group.add(head);

  const light = new THREE.PointLight(0xfff4e0, 0.5, 80, 2);
  light.position.set(x > 0 ? -8 : 8, 0, 36);
  group.add(light);

  group.position.set(x, y, 0);
  return group;
}

function createTree(x, y) {
  const group = new THREE.Group();
  const trunk = new THREE.Mesh(geoTreeTrunk, matTreeTrunk);
  trunk.rotation.x = -Math.PI / 2; // Rotate from Y to Z (up)
  trunk.position.set(0, 0, 7.5);
  trunk.castShadow = true;
  group.add(trunk);

  const cone1 = new THREE.Mesh(geoTreeCone, matTreeLeaves);
  cone1.rotation.x = -Math.PI / 2; // Rotate from Y to Z (up)
  cone1.position.set(0, 0, 24);
  cone1.castShadow = true;
  group.add(cone1);

  const cone2 = new THREE.Mesh(new THREE.ConeGeometry(4.5, 12, 8), matTreeLeaves);
  cone2.rotation.x = -Math.PI / 2; // Rotate from Y to Z (up)
  cone2.position.set(0, 0, 32);
  cone2.castShadow = true;
  group.add(cone2);

  group.position.set(x, y, 0);
  return group;
}

function createCityTile(tileY) {
  const group = new THREE.Group();

  // Road surface
  const road = new THREE.Mesh(geoRoadTile, matAsphalt);
  // No rotation needed — PlaneGeometry is already flat in XY plane (Z-up)
  road.position.set(0, 0, 0);
  road.receiveShadow = true;
  group.add(road);

  // Sidewalks
  for (const side of [-1, 1]) {
    const sw = new THREE.Mesh(geoSidewalkL, matSidewalk);
    sw.position.set(side * (ROAD_HALF_WIDTH + SIDEWALK_WIDTH/2), 0, 1);
    sw.castShadow = true;
    sw.receiveShadow = true;
    group.add(sw);

    const curb = new THREE.Mesh(geoCurb, matCurb);
    curb.position.set(side * ROAD_HALF_WIDTH, 0, 0.5);
    group.add(curb);
  }

  // Lane markings — center dashed yellow
  for (let y = -TILE_LENGTH/2 + 10; y < TILE_LENGTH/2; y += 20) {
    const dash = new THREE.Mesh(geoLaneDash,
      new THREE.MeshStandardMaterial({ color:0xffd700, roughness:0.5, emissive:0x332200 }));
    // No rotation — already flat in XY plane (Z-up)
    dash.position.set(0, y, 0.2);
    group.add(dash);
  }

  // White solid lane lines
  for (const xOffset of [-40, -20, 20, 40]) {
    const line = new THREE.Mesh(geoLaneSolid, matLaneWhite);
    // No rotation — already flat in XY plane (Z-up)
    line.position.set(xOffset, 0, 0.15);
    group.add(line);
  }

  // Grass strips
  for (const side of [-1, 1]) {
    const grass = new THREE.Mesh(new THREE.PlaneGeometry(15, TILE_LENGTH), matGrass);
    // No rotation — already flat in XY plane (Z-up)
    grass.position.set(side * (ROAD_HALF_WIDTH + SIDEWALK_WIDTH + 12), 0, 0.1);
    grass.receiveShadow = true;
    group.add(grass);
  }

  // Buildings
  for (let y = -TILE_LENGTH/2 + 25; y < TILE_LENGTH/2; y += 50 + Math.random() * 30) {
    for (const side of [-1, 1]) {
      const w = 25 + Math.random() * 35;
      const d = 20 + Math.random() * 30;
      const h = 30 + Math.random() * 90;
      const bx = side * (BUILDING_OFFSET + Math.random() * 30);
      const by = y + (Math.random() - 0.5) * 15;
      group.add(createBuilding(bx, by, 0, w, d, h));
    }
  }

  // Street lights
  for (let y = -TILE_LENGTH/2 + 40; y < TILE_LENGTH/2; y += 80) {
    for (const side of [-1, 1]) {
      group.add(createStreetLight(side * (ROAD_HALF_WIDTH + 2), y));
    }
  }

  // Trees
  for (let y = -TILE_LENGTH/2 + 20; y < TILE_LENGTH/2; y += 35 + Math.random() * 20) {
    if (Math.random() > 0.4) {
      for (const side of [-1, 1]) {
        group.add(createTree(side * (ROAD_HALF_WIDTH + SIDEWALK_WIDTH + 18 + Math.random() * 10), y));
      }
    }
  }

  group.position.y = tileY;
  scene.add(group);
  return { mesh: group, y: tileY };
}

// Create initial tiles
for (let i = 0; i < NUM_TILES; i++) {
  cityTiles.push(createCityTile(i * TILE_LENGTH - TILE_LENGTH));
}

function updateCityTiles() {
  const carTileY = Math.floor(car.pos.y / TILE_LENGTH) * TILE_LENGTH;

  cityTiles.forEach((tile) => {
    if (tile.y - carTileY < -TILE_LENGTH * 2) {
      let maxY = -Infinity;
      cityTiles.forEach(t => { if (t.y > maxY) maxY = t.y; });
      tile.y = maxY + TILE_LENGTH;
      tile.mesh.position.y = tile.y;
    }
    if (tile.y - carTileY > TILE_LENGTH * (NUM_TILES - 2)) {
      let minY = Infinity;
      cityTiles.forEach(t => { if (t.y < minY) minY = t.y; });
      tile.y = minY - TILE_LENGTH;
      tile.mesh.position.y = tile.y;
    }
  });
}

// ═══════════════════════════════════════════════════
//  CAR MODEL (real GLB from CDN)
// ═══════════════════════════════════════════════════
const CAR_URL = 'https://cdn.jsdelivr.net/gh/savitapandey1855-ship-it/infinite-highway@main/car.glb';
const loader = new GLTFLoader();
const carGroup = new THREE.Group();
let carModelLoaded = false;

const loadingFill = document.getElementById('loading-fill');
const loadingMsg = document.getElementById('loading-msg');
const loadingScreen = document.getElementById('loading');

function setupCarModel(gltfScene) {
  const carModel = gltfScene;
  const box = new THREE.Box3().setFromObject(carModel);
  const center = box.getCenter(new THREE.Vector3());

  const carScale = 1.5;
  carModel.scale.setScalar(carScale);
  carModel.rotation.x = Math.PI; // Flip Z: wheels down, roof up. Y also flips (compensated below)
  carModel.position.set(-center.x * carScale, center.y * carScale, box.max.z * carScale);

  carModel.traverse((child) => {
    if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
  });

  carGroup.add(carModel);
  scene.add(carGroup);

  carGroup.userData.wheels = [];
  carModel.traverse((child) => {
    if (child.isMesh && child.name) {
      const n = child.name.toLowerCase();
      if (n.includes('wheel') || n.includes('tire') || n.includes('rim')) {
        carGroup.userData.wheels.push(child);
      }
    }
  });
}

loader.load(CAR_URL, (gltf) => {
  setupCarModel(gltf.scene);
  carModelLoaded = true;
  loadingMsg.textContent = 'Ready!';
  loadingScreen.style.opacity = '0';
  setTimeout(() => loadingScreen.style.display = 'none', 600);
  animate();
}, (xhr) => {
  if (xhr.lengthComputable) {
    loadingFill.style.width = ((xhr.loaded / xhr.total) * 100) + '%';
  }
}, (err) => {
  console.error('Car load error:', err);
  loadingMsg.textContent = 'Error loading car model!';
  const geo = new THREE.BoxGeometry(5, 10, 4);
  const mat = new THREE.MeshStandardMaterial({ color:0xff3333, metalness:0.6, roughness:0.3 });
  const placeholder = new THREE.Mesh(geo, mat);
  placeholder.position.set(0, 0, 3);
  carGroup.add(placeholder);
  scene.add(carGroup);
  carModelLoaded = true;
  loadingScreen.style.opacity = '0';
  setTimeout(() => loadingScreen.style.display = 'none', 600);
  animate();
});

// ═══════════════════════════════════════════════════
//  CAR PHYSICS (Z-up)
// ═══════════════════════════════════════════════════
const car = {
  pos: new THREE.Vector3(0, 0, 0),
  vel: 0, heading: 0, steerAngle: 0,
  maxSpeed: 280, accel: 70, brakeForce: 180,
  reverseMax: -50, friction: 25, drag: 0.0009,
  steerSpeed: 1.8, steerMax: 0.45, steerReturn: 2.5,
  handbrake: false, wheelSpin: 0,
};

// ═══════════════════════════════════════════════════
//  CONTROLS — keyboard + touch
// ═══════════════════════════════════════════════════
const keys = {};
let steerLeft = false, steerRight = false;
let accelHold = false, brakeHold = false;
let cameraMode = 0;
const camTarget = new THREE.Vector3();

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyC') cameraMode = (cameraMode + 1) % 3;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function setupTouchBtn(id, onDown, onUp) {
  const el = document.getElementById(id);
  if (!el) return;
  const down = (e) => { e.preventDefault(); onDown(); el.classList.add('pressed'); };
  const up = (e) => { e.preventDefault(); onUp(); el.classList.remove('pressed'); };
  el.addEventListener('touchstart', down, { passive:false });
  el.addEventListener('touchend', up, { passive:false });
  el.addEventListener('touchcancel', up, { passive:false });
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}

setupTouchBtn('btn-left',  () => steerLeft = true,  () => steerLeft = false);
setupTouchBtn('btn-right', () => steerRight = true, () => steerRight = false);
setupTouchBtn('btn-gas',   () => accelHold = true,  () => accelHold = false);
setupTouchBtn('btn-brake', () => brakeHold = true,  () => brakeHold = false);

document.getElementById('btn-camera').addEventListener('click', () => {
  cameraMode = (cameraMode + 1) % 3;
});

// ═══════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════
let distance = 0, topSpeed = 0, score = 0;

function updateCar(dt) {
  const accelInput = (keys['KeyW'] || keys['ArrowUp'] || accelHold) ? 1 : 0;
  const brakeInput = (keys['KeyS'] || keys['ArrowDown'] || brakeHold) ? 1 : 0;
  car.handbrake = keys['Space'] || false;

  if (accelInput) {
    car.vel += car.accel * dt;
  } else if (brakeInput) {
    if (car.vel > 0) {
      car.vel -= car.brakeForce * dt;
      if (car.vel < 0) car.vel = 0;
    } else {
      car.vel -= car.accel * 0.4 * dt;
    }
  } else {
    if (car.vel > 0) { car.vel -= car.friction * dt; if (car.vel < 0) car.vel = 0; }
    else if (car.vel < 0) { car.vel += car.friction * dt; if (car.vel > 0) car.vel = 0; }
  }

  car.vel -= car.drag * car.vel * Math.abs(car.vel) * dt;
  if (car.handbrake) car.vel *= (1 - 3 * dt);
  car.vel = Math.max(car.reverseMax, Math.min(car.maxSpeed, car.vel));

  const steerInput = ((keys['KeyA'] || keys['ArrowLeft'] || steerLeft) ? 1 : 0)
                  - ((keys['KeyD'] || keys['ArrowRight'] || steerRight) ? 1 : 0);

  if (steerInput !== 0) {
    car.steerAngle += steerInput * car.steerSpeed * dt;
    car.steerAngle = Math.max(-car.steerMax, Math.min(car.steerMax, car.steerAngle));
  } else {
    car.steerAngle -= car.steerAngle * car.steerReturn * dt;
    if (Math.abs(car.steerAngle) < 0.005) car.steerAngle = 0;
  }

  const speedFactor = Math.max(0.3, 1 - Math.abs(car.vel) / car.maxSpeed * 0.5);
  const effectiveSteer = car.steerAngle * speedFactor * (Math.abs(car.vel) / 40 + 0.1);
  car.heading += effectiveSteer * dt;

  car.pos.x += Math.sin(car.heading) * car.vel * dt;
  car.pos.y += Math.cos(car.heading) * car.vel * dt;

  const roadEdge = ROAD_HALF_WIDTH - 3;
  if (Math.abs(car.pos.x) > roadEdge) {
    car.pos.x = Math.sign(car.pos.x) * roadEdge;
    car.vel *= 0.7;
  }

  carGroup.position.set(car.pos.x, car.pos.y, 0);
  carGroup.rotation.z = car.heading + Math.PI; // +π compensates rotation.x flip

  car.wheelSpin += car.vel * dt * 0.2;
  if (carGroup.userData.wheels) {
    carGroup.userData.wheels.forEach(w => { w.rotation.x = car.wheelSpin; });
  }

  distance = Math.max(distance, car.pos.y);
  const speedKmh = Math.abs(car.vel);
  if (speedKmh > topSpeed) topSpeed = speedKmh;
  score = Math.floor(distance / 10);
}

function updateCamera(dt) {
  const sp = Math.abs(car.vel);
  if (cameraMode === 0) {
    const h = 35 + sp * 0.08;
    const d = 70 + sp * 0.12;
    const tx = car.pos.x - Math.sin(car.heading) * d;
    const ty = car.pos.y - Math.cos(car.heading) * d;
    camera.position.x += (tx - camera.position.x) * 4 * dt;
    camera.position.y += (ty - camera.position.y) * 4 * dt;
    camera.position.z += (h - camera.position.z) * 4 * dt;
    camTarget.set(car.pos.x, car.pos.y, 10);
    camera.lookAt(camTarget);
  } else if (cameraMode === 1) {
    camera.position.set(
      car.pos.x + Math.sin(car.heading) * 8,
      car.pos.y + Math.cos(car.heading) * 8, 12);
    camTarget.set(car.pos.x + Math.sin(car.heading) * 200, car.pos.y + Math.cos(car.heading) * 200, 8);
    camera.lookAt(camTarget);
  } else {
    camera.position.set(
      car.pos.x - Math.sin(car.heading + 0.5) * 120,
      car.pos.y - Math.cos(car.heading + 0.5) * 120, 60);
    camTarget.set(car.pos.x, car.pos.y, 5);
    camera.lookAt(camTarget);
  }
}

function updateSun() {
  sun.position.set(car.pos.x + 300, car.pos.y + 200, 600);
  sun.target.position.set(car.pos.x, car.pos.y, 0);
  sun.target.updateMatrixWorld();
}

const speedEl = document.getElementById('speed-val');
const speedoArc = document.getElementById('speedo-arc');
const topspeedEl = document.getElementById('topspeed-val');
const distEl = document.getElementById('dist-val');
const scoreEl = document.getElementById('score-val');
const gearEl = document.getElementById('gear-ind');
const ARC_CIRC = 2 * Math.PI * 43;

function updateHUD() {
  const sp = Math.round(Math.abs(car.vel));
  speedEl.textContent = sp;
  topspeedEl.textContent = Math.round(topSpeed);
  distEl.textContent = (distance / 1000).toFixed(2);
  scoreEl.textContent = score;

  const pct = Math.min(1, sp / car.maxSpeed);
  speedoArc.style.strokeDashoffset = ARC_CIRC * (1 - pct);
  speedoArc.style.stroke = pct > 0.85 ? '#ff5252' : pct > 0.5 ? '#ffc107' : '#4fc3f7';

  if (car.vel < -0.5) gearEl.textContent = 'R';
  else if (car.vel < 0.5) gearEl.textContent = 'N';
  else if (sp < 50) gearEl.textContent = '1';
  else if (sp < 100) gearEl.textContent = '2';
  else if (sp < 150) gearEl.textContent = '3';
  else if (sp < 200) gearEl.textContent = '4';
  else gearEl.textContent = '5';
}

let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = Math.min(dt, 0.05);

  updateCar(dt);
  updateCityTiles();
  updateCamera(dt);
  updateSun();
  updateHUD();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
