<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Highway — Car Driving Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; }

  #loading {
    position: fixed; inset: 0; background: #0a0a12; color: #e0e0e0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.6s;
  }
  #loading h1 { font-size: 1.8rem; margin-bottom: 12px; letter-spacing: 2px; color: #4fc3f7; }
  #loading p { color: #888; font-size: 0.9rem; }
  #loading-bar { width: 260px; height: 4px; background: #222; border-radius: 2px; margin-top: 20px; overflow: hidden; }
  #loading-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4fc3f7, #81d4fa); transition: width 0.3s; }

  #hud {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 32px; align-items: flex-end; z-index: 10; pointer-events: none;
  }
  .hud-box {
    background: rgba(10, 15, 25, 0.75); border: 1px solid rgba(79, 195, 247, 0.3);
    border-radius: 12px; padding: 10px 20px; backdrop-filter: blur(8px);
    color: #e0e0e0; text-align: center; min-width: 110px;
  }
  .hud-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: #4fc3f7; margin-bottom: 4px; }
  .hud-value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hud-unit { font-size: 0.7rem; color: #888; }

  #speedo-ring { width: 120px; height: 120px; position: relative; }
  #speedo-ring svg { transform: rotate(-90deg); }
  #speedo-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #speedo-center .val { font-size: 2rem; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  #speedo-center .unit { font-size: 0.65rem; color: #4fc3f7; text-transform: uppercase; letter-spacing: 1px; }

  #controls-hint {
    position: fixed; top: 20px; right: 20px; z-index: 10;
    background: rgba(10, 15, 25, 0.75); border: 1px solid rgba(79, 195, 247, 0.2);
    border-radius: 10px; padding: 14px 18px; color: #ccc; font-size: 0.78rem;
    backdrop-filter: blur(8px); line-height: 1.8;
  }
  #controls-hint kbd {
    background: rgba(79, 195, 247, 0.15); border: 1px solid rgba(79, 195, 247, 0.3);
    border-radius: 4px; padding: 2px 7px; font-size: 0.75rem; color: #4fc3f7; font-family: monospace;
  }

  #gear-ind {
    position: fixed; bottom: 24px; right: 24px; z-index: 10;
    background: rgba(10, 15, 25, 0.75); border: 1px solid rgba(79, 195, 247, 0.3);
    border-radius: 10px; padding: 8px 16px; color: #4fc3f7; font-size: 1.3rem;
    font-weight: 700; backdrop-filter: blur(8px);
  }

  #top-bar {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(10, 15, 25, 0.75);
    border: 1px solid rgba(79, 195, 247, 0.2); border-radius: 10px;
    padding: 8px 24px; backdrop-filter: blur(8px); color: #e0e0e0;
    font-size: 0.85rem; letter-spacing: 1px;
  }
  #top-bar span { color: #4fc3f7; font-weight: 600; }
</style>
</head>
<body>

<div id="loading">
  <h1>INFINITE HIGHWAY</h1>
  <p id="loading-msg">Loading road model...</p>
  <div id="loading-bar"><div id="loading-fill"></div></div>
</div>

<div id="top-bar">DISTANCE: <span id="dist-val">0.0</span> km</div>

<div id="hud">
  <div class="hud-box">
    <div class="hud-label">Score</div>
    <div class="hud-value" id="score-val">0</div>
  </div>
  <div id="speedo-ring">
    <svg width="120" height="120">
      <circle cx="60" cy="60" r="52" stroke="rgba(255,255,255,0.08)" stroke-width="6" fill="none"/>
      <circle id="speedo-arc" cx="60" cy="60" r="52" stroke="#4fc3f7" stroke-width="6" fill="none"
              stroke-dasharray="326.7" stroke-dashoffset="326.7" stroke-linecap="round"/>
    </svg>
    <div id="speedo-center">
      <div class="val" id="speed-val">0</div>
      <div class="unit">km/h</div>
    </div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Top Speed</div>
    <div class="hud-value" id="topspeed-val">0</div>
    <div class="hud-unit">km/h</div>
  </div>
</div>

<div id="controls-hint">
  <kbd>W</kbd> / <kbd>↑</kbd> Accelerate<br>
  <kbd>S</kbd> / <kbd>↓</kbd> Brake / Reverse<br>
  <kbd>A</kbd> / <kbd>←</kbd> Steer Left<br>
  <kbd>D</kbd> / <kbd>→</kbd> Steer Right<br>
  <kbd>Space</kbd> Handbrake<br>
  <kbd>C</kbd> Camera View
</div>

<div id="gear-ind">D</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ═══════════════════════════════════════════════════════════════
//  COORDINATE SYSTEM: Z-UP (native to both GLB models)
//  - X = left/right (road width)
//  - Y = forward/backward (road length, driving direction)
//  - Z = up (height)
// ═══════════════════════════════════════════════════════════════

// ─── Renderer ─────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// ─── Scene ────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a6c4);
scene.fog = new THREE.Fog(0x87a6c4, 2000, 8000);

// ─── Camera (Z-up) ────────────────────────────────
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.5, 20000);
camera.up.set(0, 0, 1);  // Z-up!
camera.position.set(0, -200, 120);

// ─── Lighting ──────────────────────────────────────
const hemi = new THREE.HemisphereLight(0xbfd8e8, 0x4a5a2a, 0.7);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
sun.position.set(800, 400, 1500);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 100;
sun.shadow.camera.far = 5000;
sun.shadow.camera.left = -600;
sun.shadow.camera.right = 600;
sun.shadow.camera.top = 600;
sun.shadow.camera.bottom = -600;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(sun.target);

// ─── Constants ────────────────────────────────────
// Road model bounding box: Y[-5092, 4977] -> length approx 10069
// We tile copies along Y at this interval.
const TILE_LENGTH = 10000;
const NUM_TILES = 5;
const ROAD_WIDTH = 500;   // playable width for collision
const ROAD_SURFACE_Z = 6; // road surface height from model

// URLs for models hosted on GitHub Releases
const ROAD_URL = 'https://github.com/savitapandey1855-ship-it/infinite-highway/releases/download/v1.0/american_road.glb';
const CAR_URL  = 'https://github.com/savitapandey1855-ship-it/infinite-highway/releases/download/v1.0/car.glb';

// ─── DOM refs ─────────────────────────────────────
const loadingFill = document.getElementById('loading-fill');
const loadingMsg = document.getElementById('loading-msg');
const loadingScreen = document.getElementById('loading');

// ─── Asset Loading ────────────────────────────────
const loader = new GLTFLoader();
let roadTemplate = null;
let carModel = null;
const roadTiles = [];
let modelsLoaded = 0;
const TOTAL_MODELS = 2;

function onModelLoaded() {
  modelsLoaded++;
  const pct = (modelsLoaded / TOTAL_MODELS) * 100;
  loadingFill.style.width = pct + '%';

  if (modelsLoaded === TOTAL_MODELS) {
    setupRoadTiles();
    setupCar();
    loadingMsg.textContent = 'Ready!';
    loadingScreen.style.opacity = '0';
    setTimeout(() => loadingScreen.style.display = 'none', 600);
    animate();
  }
}

// Load road model
loadingMsg.textContent = 'Loading road model...';
loader.load(ROAD_URL, (gltf) => {
  roadTemplate = gltf.scene;
  roadTemplate.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  onModelLoaded();
}, (xhr) => {
  if (xhr.lengthComputable) {
    const pct = (xhr.loaded / xhr.total) * 50;
    loadingFill.style.width = pct + '%';
  }
}, (err) => {
  console.error('Road load error:', err);
  loadingMsg.textContent = 'Error loading road model!';
});

// Load car model
loadingMsg.textContent = 'Loading car model...';
loader.load(CAR_URL, (gltf) => {
  carModel = gltf.scene;
  carModel.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  onModelLoaded();
}, (xhr) => {
  if (xhr.lengthComputable) {
    const pct = 50 + (xhr.loaded / xhr.total) * 50;
    loadingFill.style.width = pct + '%';
  }
}, (err) => {
  console.error('Car load error:', err);
  loadingMsg.textContent = 'Error loading car model!';
});

// ─── Road Tiles ───────────────────────────────────
function setupRoadTiles() {
  for (let i = 0; i < NUM_TILES; i++) {
    const tile = roadTemplate.clone(true);
    tile.position.set(0, i * TILE_LENGTH, 0);
    scene.add(tile);
    roadTiles.push({ mesh: tile, y: i * TILE_LENGTH });
  }
}

function updateRoadTiles() {
  const carTileY = Math.floor(car.pos.y / TILE_LENGTH) * TILE_LENGTH;

  roadTiles.forEach((tile) => {
    if (tile.y - carTileY < -TILE_LENGTH) {
      // Move this tile to the front (furthest ahead)
      let maxY = -Infinity;
      roadTiles.forEach(t => { if (t.y > maxY) maxY = t.y; });
      tile.y = maxY + TILE_LENGTH;
      tile.mesh.position.y = tile.y;
    }
    if (tile.y - carTileY > TILE_LENGTH * (NUM_TILES - 1)) {
      // Move this tile to the back (furthest behind)
      let minY = Infinity;
      roadTiles.forEach(t => { if (t.y < minY) minY = t.y; });
      tile.y = minY - TILE_LENGTH;
      tile.mesh.position.y = tile.y;
    }
  });
}

// ─── Car ──────────────────────────────────────────
const carGroup = new THREE.Group();

function setupCar() {
  // Compute bounding box of the car model
  const box = new THREE.Box3().setFromObject(carModel);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  // Scale the car to be proportional on the road
  // Model is ~17 units long; road is ~600 wide. Scale to make car ~80 units long.
  const carScale = 5;
  carModel.scale.setScalar(carScale);

  // Offset model so origin is at center-X/Y, wheels at Z=0
  carModel.position.set(
    -center.x * carScale,
    -center.y * carScale,
    -box.min.z * carScale
  );

  carGroup.add(carModel);
  scene.add(carGroup);

  // Find wheel meshes for animation (look for meshes with "wheel" in name, or by position)
  carGroup.userData.wheels = [];
  carModel.traverse((child) => {
    if (child.isMesh && child.name) {
      const n = child.name.toLowerCase();
      if (n.includes('wheel') || n.includes('tire') || n.includes('rim')) {
        carGroup.userData.wheels.push(child);
      }
    }
  });
}

// Car physics state -- Z-up coordinate system
// Forward = +Y when heading=0
// Heading rotates around Z axis
const car = {
  pos: new THREE.Vector3(0, 200, ROAD_SURFACE_Z),
  vel: 0,
  heading: 0,       // rotation around Z
  steerAngle: 0,
  maxSpeed: 320,
  accel: 80,
  brakeForce: 200,
  reverseMax: -60,
  friction: 30,
  drag: 0.0008,
  steerSpeed: 2.0,
  steerMax: 0.5,
  steerReturn: 3.0,
  handbrake: false,
  wheelSpin: 0,
};

// ─── Controls ─────────────────────────────────────
const keys = {};
let cameraMode = 0;
let camTarget = new THREE.Vector3();

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyC') cameraMode = (cameraMode + 1) % 3;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// ─── Game State ───────────────────────────────────
let distance = 0;
let topSpeed = 0;
let score = 0;

// ─── Car Physics Update ──────────────────────────
function updateCar(dt) {
  const accelInput = (keys['KeyW'] || keys['ArrowUp']) ? 1 : 0;
  const brakeInput = (keys['KeyS'] || keys['ArrowDown']) ? 1 : 0;
  car.handbrake = keys['Space'] || false;

  if (accelInput) {
    car.vel += car.accel * dt;
  } else if (brakeInput) {
    if (car.vel > 0) {
      car.vel -= car.brakeForce * dt;
      if (car.vel < 0) car.vel = 0;
    } else {
      car.vel -= car.accel * 0.5 * dt;
    }
  } else {
    if (car.vel > 0) {
      car.vel -= car.friction * dt;
      if (car.vel < 0) car.vel = 0;
    } else if (car.vel < 0) {
      car.vel += car.friction * dt;
      if (car.vel > 0) car.vel = 0;
    }
  }

  // Drag
  const dragForce = car.drag * car.vel * Math.abs(car.vel);
  car.vel -= dragForce * dt;

  // Handbrake
  if (car.handbrake) {
    car.vel *= (1 - 3 * dt);
  }

  car.vel = Math.max(car.reverseMax, Math.min(car.maxSpeed, car.vel));

  // Steering
  const steerInput = ((keys['KeyA'] || keys['ArrowLeft']) ? 1 : 0)
                  - ((keys['KeyD'] || keys['ArrowRight']) ? 1 : 0);

  if (steerInput !== 0) {
    car.steerAngle += steerInput * car.steerSpeed * dt;
    car.steerAngle = Math.max(-car.steerMax, Math.min(car.steerMax, car.steerAngle));
  } else {
    if (Math.abs(car.steerAngle) < 0.01) {
      car.steerAngle = 0;
    } else {
      car.steerAngle -= car.steerAngle * car.steerReturn * dt;
    }
  }

  // Speed-dependent steering
  const speedFactor = Math.max(0.3, 1 - Math.abs(car.vel) / car.maxSpeed * 0.5);
  const effectiveSteer = car.steerAngle * speedFactor * (Math.abs(car.vel) / 50 + 0.1);

  car.heading += effectiveSteer * dt;

  // Update position -- Z-up: forward = (sin(h), cos(h), 0)
  car.pos.x += Math.sin(car.heading) * car.vel * dt;
  car.pos.y += Math.cos(car.heading) * car.vel * dt;

  // Road boundary (soft collision on X axis)
  const roadEdge = ROAD_WIDTH / 2;
  if (Math.abs(car.pos.x) > roadEdge) {
    car.pos.x = Math.sign(car.pos.x) * roadEdge;
    car.vel *= 0.85;
  }

  // Apply to car group
  // Z-up: heading rotates around Z, position uses (x, y, z)
  carGroup.position.set(car.pos.x, car.pos.y, ROAD_SURFACE_Z);
  carGroup.rotation.z = car.heading;

  // Wheel spin
  car.wheelSpin += car.vel * dt * 0.15;
  if (carGroup.userData.wheels) {
    carGroup.userData.wheels.forEach((w) => {
      w.rotation.x = car.wheelSpin;
    });
  }

  // Stats
  distance = Math.max(distance, car.pos.y);
  const speedKmh = Math.abs(car.vel);
  if (speedKmh > topSpeed) topSpeed = speedKmh;
  score = Math.floor(distance / 10);
}

// ─── Camera Update (Z-up) ─────────────────────────
function updateCamera(dt) {
  const speedKmh = Math.abs(car.vel);

  if (cameraMode === 0) {
    // Chase camera -- behind and above the car in Z-up
    const camHeight = 80 + speedKmh * 0.1;
    const camDist = 150 + speedKmh * 0.2;
    const targetX = car.pos.x - Math.sin(car.heading) * camDist;
    const targetY = car.pos.y - Math.cos(car.heading) * camDist;
    const targetZ = camHeight;

    camera.position.x += (targetX - camera.position.x) * 3 * dt;
    camera.position.y += (targetY - camera.position.y) * 3 * dt;
    camera.position.z += (targetZ - camera.position.z) * 3 * dt;

    camTarget.set(car.pos.x, car.pos.y, 20);
    camera.lookAt(camTarget);
  } else if (cameraMode === 1) {
    // Hood camera
    const hx = car.pos.x + Math.sin(car.heading) * 30;
    const hy = car.pos.y + Math.cos(car.heading) * 30;
    camera.position.set(hx, hy, 50);
    camTarget.set(
      car.pos.x + Math.sin(car.heading) * 300,
      car.pos.y + Math.cos(car.heading) * 300,
      30
    );
    camera.lookAt(camTarget);
  } else {
    // Cinematic far view
    const fx = car.pos.x - Math.sin(car.heading + 0.4) * 300;
    const fy = car.pos.y - Math.cos(car.heading + 0.4) * 300;
    camera.position.set(fx, fy, 180);
    camTarget.set(car.pos.x, car.pos.y, 0);
    camera.lookAt(camTarget);
  }
}

// ─── Sun follows car ──────────────────────────────
function updateSun() {
  sun.position.set(car.pos.x + 800, car.pos.y + 400, 1500);
  sun.target.position.set(car.pos.x, car.pos.y, 0);
  sun.target.updateMatrixWorld();
}

// ─── HUD ──────────────────────────────────────────
const speedEl = document.getElementById('speed-val');
const speedoArc = document.getElementById('speedo-arc');
const topspeedEl = document.getElementById('topspeed-val');
const distEl = document.getElementById('dist-val');
const scoreEl = document.getElementById('score-val');
const gearEl = document.getElementById('gear-ind');
const ARC_CIRC = 2 * Math.PI * 52;

function updateHUD() {
  const speedKmh = Math.round(Math.abs(car.vel));
  speedEl.textContent = speedKmh;
  topspeedEl.textContent = Math.round(topSpeed);
  distEl.textContent = (distance / 1000).toFixed(2);
  scoreEl.textContent = score;

  const pct = Math.min(1, speedKmh / car.maxSpeed);
  speedoArc.style.strokeDashoffset = ARC_CIRC * (1 - pct);
  speedoArc.style.stroke = pct > 0.8 ? '#ff5252' : pct > 0.5 ? '#ffc107' : '#4fc3f7';

  if (car.vel < -0.5) gearEl.textContent = 'R';
  else if (car.vel < 0.5) gearEl.textContent = 'N';
  else if (speedKmh < 60) gearEl.textContent = '1';
  else if (speedKmh < 120) gearEl.textContent = '2';
  else if (speedKmh < 180) gearEl.textContent = '3';
  else if (speedKmh < 240) gearEl.textContent = '4';
  else gearEl.textContent = '5';
}

// ─── Animation Loop ──────────────────────────────
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  dt = Math.min(dt, 0.05);

  updateCar(dt);
  updateRoadTiles();
  updateCamera(dt);
  updateSun();
  updateHUD();

  renderer.render(scene, camera);
}

// ─── Resize ───────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
